name: Ninforge temporary CIA ticket QA
on:
  push:
    branches: [feat/bootstrap-format-inspection]
permissions:
  contents: write
jobs:
  format-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Save formatted Rust to existing development branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ tests/
          if ! git diff --cached --quiet; then
            git commit -m 'style: rustfmt CIA ticket metadata checks'
            git push origin HEAD:feat/bootstrap-format-inspection
          fi
