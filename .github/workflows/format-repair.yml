name: Ninforge temporary metadata QA
on:
  push:
    branches: [feat/bootstrap-format-inspection]
permissions:
  contents: write
jobs:
  format-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - name: Commit formatter output to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/
          if ! git diff --cached --quiet; then
            git commit -m 'style: rustfmt external metadata audit'
            git push origin HEAD:feat/bootstrap-format-inspection
          fi
