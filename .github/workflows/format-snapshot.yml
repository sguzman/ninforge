# Temporary non-mutating bootstrap formatter; remove after source is formatted.
name: Rust format snapshot
on:
  push:
    branches: [feat/bootstrap-format-inspection]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all
      - uses: actions/upload-artifact@v4
        with:
          name: rustfmt-source
          path: src/
          if-no-files-found: error
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
        if: always()
