name: Rust CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Refuse binary game assets or console keys in tracked files
        run: |
          set -eu
          git ls-files | grep -Ei '\.(nsp|nsz|xci|xcz|nca|ncz|cia|3ds|cci|cxi|nds|srl|gba|gbc|gb|nes|fds|sfc|smc|n64|z64|v64|iso|wbfs|wud|wux|wad|sav|srm|dsv|keys|tik)$|(^|/)(prod\.keys|title\.keys|keys\.txt)$' && {
            echo 'Forbidden tracked Nintendo asset or key detected' >&2
            exit 1
          } || test "$?" -eq 1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
